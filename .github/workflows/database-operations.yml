name: Validar operações do banco

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "scripts/**"
      - "docs/database-backup.md"
      - ".github/workflows/database-operations.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "scripts/**"
      - "docs/database-backup.md"
      - ".github/workflows/database-operations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar scripts PowerShell
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Localizar scripts PowerShell
        shell: pwsh
        run: |
          $scripts = Get-ChildItem `
            -LiteralPath ".\scripts" `
            -Filter "*.ps1" `
            -File

          if ($scripts.Count -eq 0) {
            throw "Nenhum script PowerShell foi encontrado."
          }

          Write-Host "$($scripts.Count) scripts encontrados."

          foreach ($script in $scripts) {
            Write-Host "- $($script.FullName)"
          }

      - name: Validar sintaxe dos scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem `
            -LiteralPath ".\scripts" `
            -Filter "*.ps1" `
            -File

          if ($scripts.Count -eq 0) {
            throw "Nenhum script PowerShell foi encontrado."
          }

          $allErrors = @()

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                $allErrors += (
                  "$($parseError.Extent.File):" +
                  "$($parseError.Extent.StartLineNumber): " +
                  "$($parseError.Message)"
                )
              }

              continue
            }

            Write-Host "Sintaxe aprovada: $($script.Name)"
          }

          if ($allErrors.Count -gt 0) {
            throw (
              "Erros de sintaxe encontrados:`n" +
              ($allErrors -join "`n")
            )
          }

          Write-Host "Todos os scripts PowerShell foram aprovados."
