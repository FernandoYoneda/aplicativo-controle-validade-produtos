name: Publicar imagens de contêiner

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confirmar versão na branch principal
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Preparar nomes e versão
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr "[:upper:]" "[:lower:]")
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${OWNER}/aplicativo-controle-validade-produtos-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${OWNER}/aplicativo-controle-validade-produtos-web" >> "$GITHUB_ENV"

      - name: Autenticar no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Compilar imagem da API
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --target runtime \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${API_IMAGE}:${VERSION}" \
            --tag "${API_IMAGE}:latest" \
            .

      - name: Compilar imagem do frontend
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --target runtime \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${WEB_IMAGE}:${VERSION}" \
            --tag "${WEB_IMAGE}:latest" \
            .

      - name: Publicar imagens
        run: |
          docker push "${API_IMAGE}:${VERSION}"
          docker push "${API_IMAGE}:latest"
          docker push "${WEB_IMAGE}:${VERSION}"
          docker push "${WEB_IMAGE}:latest"

      - name: Encerrar autenticação
        if: always()
        run: docker logout ghcr.io
